[metadata]
name = sinan-embedded-agent
version = 0.1.0
description = 司南嵌入式智能体工作台 — 面向嵌入式开发者的全流程智能体
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Sinán Team
keywords = embedded, agent, mcu, iot, robotics
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development :: Embedded Systems

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    pyyaml>=6.0
    prompt_toolkit>=3.0
    rich>=13.0
    httpx>=0.25
    pyserial>=3.5
    pydantic>=2.0.0
    whoosh>=2.7.4

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    ruff>=0.6.0
esptool =
    esptool>=4.0
jsonschema =
    jsonschema>=4.0

[options.entry_points]
console_scripts =
    sinan = agent.cli:main

[options.packages.find]
include =
    agent*
    knowledge*
    board_knowledge*
    skills*

[options.package_data]
knowledge =
    **/*.yaml
    **/*.yml
    **/*.md
    **/*.json
board_knowledge =
    **/*.md
    **/*.json
    **/*.template.json
skills =
    **/*.md
