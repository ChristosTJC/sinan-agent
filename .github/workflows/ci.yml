name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .

  unit-test:
    runs-on: ubuntu-22.04
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Prepare test environment
        run: |
          mkdir -p /tmp/sinan-test-home/memories
          mkdir -p /tmp/sinan-test-home/audit
          echo "# Test" > /tmp/sinan-test-home/memories/MEMORY.md

      - name: CLI smoke
        run: |
          SINAN_HOME=/tmp/sinan-test-home sinan demo
          SINAN_HOME=/tmp/sinan-test-home sinan doctor
          SINAN_HOME=/tmp/sinan-test-home sinan report --output /tmp/sinan-test-home/sinan-report.md
          SINAN_HOME=/tmp/sinan-test-home sinan run "扫描串口设备" --output-dir /tmp/sinan-test-home/run-smoke
          test -s /tmp/sinan-test-home/sinan-report.md
          test -s /tmp/sinan-test-home/run-smoke/trace.jsonl

      - name: Unit Test
        run: |
          SINAN_HOME=/tmp/sinan-test-home python -m pytest -q -m "not integration"

  integration-test:
    runs-on: ubuntu-22.04
    needs: [unit-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Prepare test environment
        run: |
          mkdir -p /tmp/sinan-test-home/memories
          mkdir -p /tmp/sinan-test-home/audit
          echo "# Test" > /tmp/sinan-test-home/memories/MEMORY.md

      - name: Integration Test
        run: |
          SINAN_HOME=/tmp/sinan-test-home python -m pytest -q -m "integration"

  build-wheel:
    runs-on: ubuntu-22.04
    needs: [integration-test, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build wheel
        run: |
          python -m pip wheel --no-deps . -w dist

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("sinan_embedded_agent-*.whl"))
          assert wheels, "wheel artifact was not built"

          required = {
              "knowledge/error_codes/stm32_hal.yaml",
              "board_knowledge/boards/example_stm32f407.json",
              "skills/hardware-debug/SKILL.md",
          }
          with ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          assert not missing, f"wheel is missing package data: {missing}"
          print(f"Verified {wheels[0]}")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinan-embedded-agent-wheel
          path: dist/*.whl
          if-no-files-found: error
